# Mock is an offline planner, useful for preparing projects without API credentials.
# For real production, change each role's provider/model and configure .env.
models:
  planner: { provider: mock, model: offline-planner, temperature: 0.3 }
  storyboard: { provider: mock, model: offline-director, temperature: 0.5 }
  coder: { provider: mock, model: offline-recipes, temperature: 0.2 }
  repair: { provider: mock, model: offline-repair, temperature: 0.1 }
  visual_review: { provider: mock, model: offline-review, vision: false, temperature: 0.1 }
  fallback: { provider: mock, model: offline-fallback, temperature: 0.2 }
